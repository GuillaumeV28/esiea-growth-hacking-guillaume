<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16836f"/></marker></defs><rect width="1920" height="1080" fill="#f2f5f8"/><rect width="1920" height="190" fill="#15354e"/><g font-family="Arial, sans-serif"><text x="80" y="62" font-size="20" letter-spacing="2" fill="#a4d7cd">SUJET 2 · GUILLAUME VOISINE · OPTION APPELS ENTRANTS</text><text x="80" y="119" font-size="46" font-weight="700" fill="#ffffff">Un agent vocal pour le support étudiant ESIEA</text><text x="80" y="158" font-size="24" fill="#d5e4ee">Prototype pédagogique non officiel · Architecture prévue, à valider par un appel réel</text><g transform="translate(80 240)"><rect width="520" height="280" rx="24" fill="#fff" stroke="#d8e1e9"/><rect x="28" y="28" width="52" height="43" rx="12" fill="#e4f1ed"/><text x="54" y="58" text-anchor="middle" font-size="25" font-weight="700" fill="#157563">01</text><text x="100" y="54" font-size="18" letter-spacing="1.1" fill="#62748a">NAVIGATEUR OU TÉLÉPHONE</text><text x="28" y="112" font-size="30" font-weight="700" fill="#18344e">L’étudiant appelle</text><circle cx="35" cy="155" r="3" fill="#16836f"/><text x="50" y="163" font-size="21" fill="#3f536a">Accueil en français et annonce IA</text><circle cx="35" cy="191" r="3" fill="#16836f"/><text x="50" y="199" font-size="21" fill="#3f536a">Accord explicite avant les questions</text><circle cx="35" cy="227" r="3" fill="#16836f"/><text x="50" y="235" font-size="21" fill="#3f536a">Prénom facultatif, puis besoin précis</text></g><g transform="translate(700 240)"><rect width="520" height="280" rx="24" fill="#fff" stroke="#d8e1e9"/><rect x="28" y="28" width="52" height="43" rx="12" fill="#e4f1ed"/><text x="54" y="58" text-anchor="middle" font-size="25" font-weight="700" fill="#157563">02</text><text x="100" y="54" font-size="18" letter-spacing="1.1" fill="#62748a">STT → MODÈLE → TTS</text><text x="28" y="112" font-size="30" font-weight="700" fill="#18344e">Vapi écoute et répond</text><circle cx="35" cy="155" r="3" fill="#16836f"/><text x="50" y="163" font-size="21" fill="#3f536a">Consignes des sujets 1 et 2</text><circle cx="35" cy="191" r="3" fill="#16836f"/><text x="50" y="199" font-size="21" fill="#3f536a">Réponses courtes et interruptions</text><circle cx="35" cy="227" r="3" fill="#16836f"/><text x="50" y="235" font-size="21" fill="#3f536a">Information inconnue : aucune invention</text></g><g transform="translate(1320 240)"><rect width="520" height="280" rx="24" fill="#fff" stroke="#d8e1e9"/><rect x="28" y="28" width="52" height="43" rx="12" fill="#e4f1ed"/><text x="54" y="58" text-anchor="middle" font-size="25" font-weight="700" fill="#157563">03</text><text x="100" y="54" font-size="18" letter-spacing="1.1" fill="#62748a">EXTRACTION POST-APPEL</text><text x="28" y="112" font-size="30" font-weight="700" fill="#18344e">Le résultat est structuré</text><circle cx="35" cy="155" r="3" fill="#16836f"/><text x="50" y="163" font-size="21" fill="#3f536a">contact · qualification · métadonnées</text><circle cx="35" cy="191" r="3" fill="#16836f"/><text x="50" y="199" font-size="21" fill="#3f536a">Accord IA, besoin, résumé et statut</text><circle cx="35" cy="227" r="3" fill="#16836f"/><text x="50" y="235" font-size="21" fill="#3f536a">call_id et durée fournis par la plateforme</text></g><g transform="translate(1320 620)"><rect width="520" height="280" rx="24" fill="#fff" stroke="#d8e1e9"/><rect x="28" y="28" width="52" height="43" rx="12" fill="#e4f1ed"/><text x="54" y="58" text-anchor="middle" font-size="25" font-weight="700" fill="#157563">04</text><text x="100" y="54" font-size="18" letter-spacing="1.1" fill="#62748a">WEBHOOK POST CODÉ</text><text x="28" y="112" font-size="30" font-weight="700" fill="#18344e">Apps Script reçoit</text><circle cx="35" cy="155" r="3" fill="#16836f"/><text x="50" y="163" font-size="21" fill="#3f536a">Secret + assistant attendu + call_id</text><circle cx="35" cy="191" r="3" fill="#16836f"/><text x="50" y="199" font-size="21" fill="#3f536a">File persistante et déduplication</text><circle cx="35" cy="227" r="3" fill="#16836f"/><text x="50" y="235" font-size="21" fill="#3f536a">Résultat retardé : reprise API bornée</text></g><g transform="translate(700 620)"><rect width="520" height="280" rx="24" fill="#fff" stroke="#d8e1e9"/><rect x="28" y="28" width="52" height="43" rx="12" fill="#e4f1ed"/><text x="54" y="58" text-anchor="middle" font-size="25" font-weight="700" fill="#157563">05</text><text x="100" y="54" font-size="18" letter-spacing="1.1" fill="#62748a">TOUR DE CONTRÔLE</text><text x="28" y="112" font-size="30" font-weight="700" fill="#18344e">Google Sheets centralise</text><circle cx="35" cy="155" r="3" fill="#16836f"/><text x="50" y="163" font-size="21" fill="#3f536a">Appels · Dashboard · File · Journal</text><circle cx="35" cy="191" r="3" fill="#16836f"/><text x="50" y="199" font-size="21" fill="#3f536a">Score de complétude sur 100</text><circle cx="35" cy="227" r="3" fill="#16836f"/><text x="50" y="235" font-size="21" fill="#3f536a">Résolu ou demande de suivi humain</text></g><g transform="translate(80 620)"><rect width="520" height="280" rx="24" fill="#fff" stroke="#d8e1e9"/><rect x="28" y="28" width="52" height="43" rx="12" fill="#e4f1ed"/><text x="54" y="58" text-anchor="middle" font-size="25" font-weight="700" fill="#157563">06</text><text x="100" y="54" font-size="18" letter-spacing="1.1" fill="#62748a">INTERVENTION HUMAINE</text><text x="28" y="112" font-size="30" font-weight="700" fill="#18344e">L’équipe suit les demandes</text><circle cx="35" cy="155" r="3" fill="#16836f"/><text x="50" y="163" font-size="21" fill="#3f536a">Hors périmètre ou difficulté persistante</text><circle cx="35" cy="191" r="3" fill="#16836f"/><text x="50" y="199" font-size="21" fill="#3f536a">Résumé confirmé, pas de délai promis</text><circle cx="35" cy="227" r="3" fill="#16836f"/><text x="50" y="235" font-size="21" fill="#3f536a">Aucun email ou transfert simulé</text></g><g fill="none" stroke="#16836f" stroke-width="5" marker-end="url(#a)"><path d="M 615 380 H 679"/><path d="M 1235 380 H 1299"/><path d="M 1580 536 V 600"/><path d="M 1304 760 H 1240"/><path d="M 684 760 H 620"/></g><rect x="80" y="948" width="1760" height="72" rx="18" fill="#e2ebe8"/><text x="110" y="990" font-size="23" font-weight="700" fill="#176350">Aucun Make, n8n ou Zapier</text><text x="560" y="990" font-size="23" fill="#244a45">Pas de secret dans le prompt</text><text x="1110" y="990" font-size="23" fill="#244a45">Pas de transcription brute dans Sheets</text><text x="80" y="1050" font-size="18" fill="#63768b">Le score mesure la complétude d’une demande, jamais la valeur ou le niveau scolaire d’un étudiant.</text></g></svg>