<!doctype html><html lang="fr"><meta charset="utf-8"><style>body{font:14px Arial;padding:10px;color:#172b3a}label{display:block;margin:16px 0 5px}input,textarea{width:95%;padding:7px}textarea{height:220px}button{padding:12px;margin-top:16px}#msg{white-space:pre-wrap}</style>
<h2>Ajouter une offre</h2><p>Copie le lien et le texte complet de l’offre. L’extension peut préparer ces champs. Aucun cookie de connexion n’est collecté.</p>
<label for="json">JSON préparé par l’extension (facultatif)</label><textarea id="json" style="height:65px"></textarea><button onclick="charger()">Remplir les champs</button>
<label for="url">URL de l’offre</label><input id="url" type="url"><button onclick="extraire()">Extraire l’offre publique</button><p>Extraction par URL pour SmartRecruiters. Pour les autres sites, utilise le texte sélectionné dans l’extension.</p><label for="text">Texte complet de l’offre</label><textarea id="text"></textarea>
<label for="email">Email du recruteur, uniquement s’il est indiqué et vérifié</label><input id="email" type="email"><label><input id="ok" type="checkbox" style="width:auto"> J’ai vérifié le contenu complet</label>
<button id="add" onclick="ajouter()">Ajouter au suivi</button><p id="msg" role="status"></p>
<script>function extraire(){document.getElementById('msg').textContent='Extraction…';document.getElementById('ok').checked=false;google.script.run.withSuccessHandler(p=>{document.getElementById('text').value=p.text;document.getElementById('msg').textContent='Relis le texte avant de confirmer qu’il est complet.';}).withFailureHandler(e=>{document.getElementById('msg').textContent=e.message;}).extraireOffrePublique(document.getElementById('url').value);}function charger(){try{const p=JSON.parse(document.getElementById('json').value);document.getElementById('url').value=p.url||'';document.getElementById('text').value=p.text||'';document.getElementById('ok').checked=false;}catch{document.getElementById('msg').textContent='JSON invalide.';}}function ajouter(){const b=document.getElementById('add');b.disabled=true;google.script.run.withSuccessHandler(r=>{document.getElementById('msg').textContent=r.duplicate?'Offre déjà présente.':'Offre ajoutée. Sélectionne sa ligne puis Préparer.';b.disabled=false;}).withFailureHandler(e=>{document.getElementById('msg').textContent=e.message;b.disabled=false;}).ajouterOffre({url:document.getElementById('url').value,text:document.getElementById('text').value,email:document.getElementById('email').value,complete:document.getElementById('ok').checked});}</script></html>
